[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "scrawler-extractor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["spacy==3.8.11", "click==8.2.1", "pdfplumber==0.11.7", "requests==2.32.5"]
[project.optional-dependencies]
test = ["pytest==8.4.2", "reportlab==4.4.3"]
[project.scripts]
scrawler-worker = "scrawler_extractor.worker:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
